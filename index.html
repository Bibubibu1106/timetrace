  --danger-soft: rgba(251, 113, 133, 0.20);
  --divider: rgba(216, 204, 255, 0.16);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  margin: 0; padding: 0;
  min-height: 100%;
  background-color: var(--bg-fallback);
}

body {
  margin: 0; padding: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Segoe UI", sans-serif;
  color: var(--text-main);
  background: transparent;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: -64px;
  bottom: -64px;
  left: 0;
  right: 0;
  z-index: -1;
  pointer-events: none;
  background-color: var(--bg-fallback);
  background-image: var(--galaxy-bg);
  background-position: center center;
  background-repeat: no-repeat;
  background-size: cover;
}

.app-shell {
  max-width: 760px;
  margin: 0 auto;
  padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bot) + 98px);
}

.desktop-sidebar { display: none; }

.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--radius-xl);
}

/* 顶栏（手机窄屏直接悬浮于星空之上，使用高对比星光白字与亮框图标） */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: #ffffff;
  border: 2px solid rgba(255, 255, 255, 0.92);
  box-shadow: 0 4px 14px rgba(14, 7, 36, 0.32);
}
.brand-title { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; margin: 0; line-height: 1.2; color: var(--text-main); }
.brand-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; font-weight: 500; }
.top-bar .brand-title {
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(12, 6, 34, 0.62);
}
.top-bar .brand-sub {
  color: rgba(255, 255, 255, 0.90);
  text-shadow: 0 1px 8px rgba(12, 6, 34, 0.55);
}

.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 12px;
  border: 1px solid var(--glass-border); background: var(--glass-strong);
  color: var(--text-main); display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform 0.15s ease, background 0.2s ease;
}
.icon-btn:active { transform: scale(0.93); }
.sync-pill {
  height: 36px; padding: 0 12px; border-radius: 12px;
  border: 1px solid var(--glass-border); background: var(--glass-strong);
  color: var(--text-main); font-size: 12.5px; font-weight: 550;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
.sync-dot.ok { background: #36a88a; box-shadow: 0 0 0 3px rgba(54, 168, 138, 0.16); }
.sync-dot.busy { background: var(--primary); animation: pulse 1s infinite; }
.sync-dot.err { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin 0.9s linear infinite; }

/* 快捷新建栏 */
.composer {
  padding: 12px 14px; margin-bottom: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.composer-row { display: flex; align-items: center; gap: 10px; }
.composer-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: 15.5px; color: var(--text-main); padding: 6px 2px;
}
.composer-input::placeholder { color: var(--text-muted); }
.add-btn {
  height: 36px; padding: 0 16px; border-radius: 11px; border: none;
  background: linear-gradient(135deg, #6d4aff, #db2777);
  color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(109, 74, 255, 0.28);
}
.add-btn:active { transform: scale(0.96); }
.composer-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--divider); padding-top: 9px;
}
.cat-pick-list { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.cat-pick-list::-webkit-scrollbar { display: none; }

.ddl-picker-wrap { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.ddl-pill {
  position: relative; height: 31px; padding: 0 11px; border-radius: 999px;
  border: 1px dashed var(--divider); background: var(--glass-strong);
  color: var(--text-sub); font-size: 12px; font-weight: 550;
  display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap;
}
.ddl-pill.has-ddl {
  border-style: solid; border-color: #f97316;
  background: rgba(249, 115, 22, 0.14); color: #ea580c; font-weight: 650;
}
[data-theme="dark"] .ddl-pill.has-ddl { color: #fdba74; border-color: #fb923c; }
.ddl-native-input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; border: none;
}
.ddl-clear-btn {
  width: 24px; height: 24px; border-radius: 50%; border: none;
  background: var(--danger-soft); color: var(--danger);
  font-size: 14px; font-weight: 700; cursor: pointer; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
}

/* 筛选条与分类胶囊 */
.filter-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
}
.chips-scroll {
  display: flex; align-items: center; gap: 7px;
  overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; flex: 1; min-width: 0;
}
.chips-scroll::-webkit-scrollbar { display: none; }
.chip {
  height: 31px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--glass-border); background: var(--glass-strong);
  color: var(--text-main); font-size: 12.5px; font-weight: 550;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer;
  transition: all 0.18s ease;
}
.chip.active {
  background: var(--chip-active-bg); border-color: var(--chip-active-border);
  color: var(--chip-active-ink); font-weight: 650;
}
.cat-dot {
  width: 9.5px; height: 9.5px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.72);
}
[data-theme="dark"] .cat-dot { box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.55); }

.swatch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.swatch-btn {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; padding: 0; transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.swatch-btn.active {
  transform: scale(1.16);
  border-color: #ffffff;
  box-shadow: 0 0 0 2.5px var(--primary);
}

.sub-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px;
}
.seg-group {
  display: inline-flex; padding: 3px; border-radius: 11px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
}
.seg-btn {
  border: none; background: transparent; color: var(--text-sub);
  font-size: 12.5px; font-weight: 550; padding: 5px 11px; border-radius: 8px; cursor: pointer;
}
.seg-btn.active { background: var(--chip-active-bg); color: var(--chip-active-ink); font-weight: 650; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

.search-box {
  flex: 1; max-width: 220px; height: 34px; padding: 0 10px;
  border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass-strong);
  color: var(--text-sub);
  display: flex; align-items: center; gap: 6px;
}
.search-box input {
  width: 100%; border: none; outline: none; background: transparent;
  font-size: 12.5px; color: var(--text-main);
}
.search-box input::placeholder { color: var(--text-muted); }

/* 待办事项列表 */
.task-list { display: flex; flex-direction: column; gap: 10px; }
.task-item {
  padding: 13px 15px; display: flex; align-items: flex-start; gap: 12px;
  transition: transform 0.15s ease, opacity 0.2s ease; cursor: pointer;
}
.task-item:hover { transform: translateY(-1px); }
.task-item.done { opacity: 0.84; }

.check-btn {
  width: 23px; height: 23px; border-radius: 50%; margin-top: 1px; flex-shrink: 0;
  border: 1.8px solid var(--primary); background: rgba(255,255,255,0.4);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; transition: all 0.2s ease; color: transparent;
}
[data-theme="dark"] .check-btn { background: rgba(15,23,42,0.35); }
.task-item.done .check-btn {
  border-color: var(--mint); background: linear-gradient(135deg, var(--primary), var(--mint)); color: #fff;
}

.task-body { flex: 1; min-width: 0; }
.task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.task-title {
  font-size: 15px; font-weight: 560; line-height: 1.42; word-break: break-word;
  transition: color 0.2s ease;
}
.task-item.done .task-title {
  text-decoration: line-through; text-decoration-color: var(--text-muted); color: var(--text-sub);
}
.task-note {
  font-size: 12.5px; color: var(--text-sub); margin-top: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* 核心亮点：创建日期 + 完成日期 + 耗时徽章 */
.time-meta-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px;
}
.meta-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; padding: 2.5px 8px; border-radius: 7px;
  font-variant-numeric: tabular-nums; line-height: 1.35;
}
.badge-cat { background: rgba(120, 108, 156, 0.14); color: var(--text-main); font-weight: 550; }
.badge-created { background: var(--primary-soft); color: var(--primary); font-weight: 550; }
.badge-completed { background: var(--done-soft); color: var(--done-ink); font-weight: 600; }
.badge-duration { background: var(--amber-soft); color: var(--amber); font-weight: 600; }
.badge-ddl { background: rgba(236, 72, 153, 0.13); color: #be185d; font-weight: 600; }
.badge-ddl-soon { background: rgba(249, 115, 22, 0.16); color: #c2410c; font-weight: 650; }
.badge-ddl-overdue { background: var(--danger-soft); color: var(--danger); font-weight: 650; }
[data-theme="dark"] .badge-ddl { color: #f9a8d4; }
[data-theme="dark"] .badge-ddl-soon { color: #fdba74; }

/* 统计卡片与历史时间轴 */
.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px;
}
.stat-card { padding: 13px 10px; text-align: center; }
.stat-inner-box {
  padding: 13px 10px; text-align: center; border-radius: 14px;
  background: var(--glass-strong); border: 1px solid var(--divider);
}
.stat-val { font-size: 20px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-lbl { font-size: 11.5px; color: var(--text-sub); margin-top: 4px; font-weight: 500; }

/* 整版可滑动月历与待办标记点 */
.cal-card {
  padding: 15px 14px 13px; margin-bottom: 16px;
  user-select: none; -webkit-user-select: none; touch-action: pan-y;
}
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.cal-nav-group { display: inline-flex; align-items: center; gap: 6px; }
.cal-title {
  font-size: 15.5px; font-weight: 700; color: var(--text-main);
  min-width: 102px; text-align: center; font-variant-numeric: tabular-nums;
}
.cal-arrow-btn {
  width: 30px; height: 30px; border-radius: 9px;
  border: 1px solid var(--divider); background: var(--glass-strong);
  color: var(--text-main); display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.cal-arrow-btn:active { transform: scale(0.92); }
.cal-mini-btn { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 9px; }
.cal-mini-btn.active {
  background: var(--chip-active-bg); border-color: var(--chip-active-border);
  color: var(--chip-active-ink); font-weight: 650;
}

.cal-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  text-align: center; font-size: 12px; font-weight: 600;
  color: var(--text-muted); margin-bottom: 6px;
}
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  transition: transform 0.18s ease, opacity 0.18s ease;
}
.cal-cell {
  height: 44px; border-radius: 11px; border: 1.5px solid transparent;
  background: transparent; color: var(--text-main);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; padding: 0; font-family: inherit;
  transition: background 0.15s ease, transform 0.12s ease;
}
.cal-cell:hover { background: var(--primary-soft); }
.cal-cell.other-month { opacity: 0.36; }
.cal-cell.has-data .cal-day-num { font-weight: 700; }
.cal-cell.is-today {
  border-color: var(--primary);
  background: var(--primary-soft);
}
.cal-cell.selected {
  background: linear-gradient(135deg, #6d4aff, #db2777);
  border-color: transparent;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(109, 74, 255, 0.30);
}
.cal-day-num { font-size: 13.5px; font-weight: 550; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cal-dots { display: flex; align-items: center; justify-content: center; gap: 3px; height: 6px; }
.cal-dot { width: 5.5px; height: 5.5px; border-radius: 50%; display: inline-block; }
.cal-dot.ddl { background: #f97316; }
.cal-dot.create { background: #6342f5; }
.cal-dot.finish { background: #10b981; }
.cal-cell.selected .cal-dot.ddl { background: #fde68a; }
.cal-cell.selected .cal-dot.create { background: #ffffff; }
.cal-cell.selected .cal-dot.finish { background: #6ee7b7; }

.cal-legend {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 9px;
  border-top: 1px solid var(--divider); font-size: 11.5px; color: var(--text-sub);
}
.cal-legend-dots { display: flex; align-items: center; gap: 10px; font-weight: 550; }
.cal-legend-dots span { display: inline-flex; align-items: center; gap: 4px; }
.cal-hint { font-size: 11.5px; color: var(--text-muted); }

.day-group { margin-bottom: 18px; }
.day-header {
  font-size: 13.5px; font-weight: 650; color: #ffffff;
  text-shadow: 0 1px 8px rgba(12, 6, 34, 0.62);
  margin: 0 0 9px 2px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.day-header span:last-child {
  font-size: 12px; font-weight: 600; color: #ffffff;
  background: rgba(255, 255, 255, 0.20);
  border: 1px solid rgba(255, 255, 255, 0.34);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 2.5px 10px; border-radius: 999px;
}
.timeline-card { padding: 4px 14px; }
.tl-row {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 0; border-bottom: 1px solid var(--divider); cursor: pointer;
}
.tl-row:last-child { border-bottom: none; }
.tl-time {
  width: 44px; font-size: 12px; font-weight: 600; color: var(--text-sub);
  font-variant-numeric: tabular-nums; padding-top: 2px; flex-shrink: 0;
}
.tl-tag {
  font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; flex-shrink: 0;
}
.tl-tag.create { background: var(--primary-soft); color: var(--primary); }
.tl-tag.finish { background: var(--done-soft); color: var(--done-ink); }
.tl-tag.ddl { background: rgba(249, 115, 22, 0.16); color: #c2410c; }
[data-theme="dark"] .tl-tag.ddl { color: #fdba74; }

/* 设置页 */
.settings-stack, .settings-right-col { display: flex; flex-direction: column; gap: 14px; }
.setting-panel { padding: 16px; }
.panel-title {
  font-size: 15px; font-weight: 650; margin: 0 0 4px;
  display: flex; align-items: center; gap: 7px;
}
.panel-desc { font-size: 12.5px; color: var(--text-sub); margin: 0 0 12px; line-height: 1.5; }
.field-group { margin-bottom: 11px; }
.field-label { display: block; font-size: 12px; font-weight: 550; color: var(--text-sub); margin-bottom: 5px; }
.text-field {
  width: 100%; height: 38px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--divider); background: var(--glass-strong);
  color: var(--text-main); font-size: 13.5px; outline: none;
}
textarea.text-field { height: 74px; padding: 9px 12px; resize: vertical; font-family: inherit; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn-soft {
  height: 35px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--glass-border); background: var(--glass-strong);
  color: var(--text-main); font-size: 13px; font-weight: 550;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
.btn-primary {
  background: linear-gradient(135deg, #6d4aff, #db2777);
  color: #fff; border: none;
}
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }

/* 底部紧凑悬浮导航栏 */
.bottom-dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--safe-bot) + 14px); z-index: 40;
  display: flex; align-items: center; gap: 6px; padding: 6px;
  border-radius: 999px; background: var(--glass-strong);
  backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--glass-border); box-shadow: 0 10px 28px rgba(15, 35, 58, 0.13);
}
.dock-tab {
  height: 40px; padding: 0 18px; border-radius: 999px; border: none;
  background: transparent; color: var(--text-sub);
  font-size: 13px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
}
.dock-tab.active {
  background: var(--chip-active-bg);
  color: var(--chip-active-ink); font-weight: 650;
}

/* 详情弹窗与统一尺寸关闭按钮 (32x32) */
.modal-mask {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(15, 23, 42, 0.32); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-mask.open { display: flex; }
.modal-card {
  width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
  padding: 18px; background: var(--glass-strong); border-radius: 22px;
  border: 1px solid var(--glass-border); box-shadow: 0 20px 48px rgba(0, 0, 0, 0.18);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
}
.modal-title { font-size: 16px; font-weight: 650; margin: 0; }
.close-fixed-btn {
  width: 32px; height: 32px; min-width: 32px; min-height: 32px;
  border-radius: 10px; border: 1px solid var(--divider); background: var(--glass-bg);
  color: var(--text-sub); display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; flex-shrink: 0;
}

/* 空状态与 2 秒自动关闭 Toast */
.empty-box { padding: 42px 20px; text-align: center; color: var(--text-sub); }
.empty-box p { margin: 10px 0 0; font-size: 13.5px; }
.toast {
  position: fixed; top: calc(var(--safe-top) + 18px); left: 50%;
  transform: translate(-50%, -16px); opacity: 0; pointer-events: none; z-index: 120;
  padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 550;
  background: var(--glass-strong); color: var(--text-main);
  border: 1px solid var(--glass-border); box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  transition: all 0.22s ease; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.hidden { display: none !important; }

@media (max-width: 520px) {
  .stats-grid { gap: 8px; }
  .stat-val { font-size: 18px; }
  .search-box { max-width: 150px; }
  .dock-tab { padding: 0 14px; font-size: 12.5px; }
}

/* iPad 平板与 Mac/电脑大屏自适应布局 */
@media (min-width: 820px) {
  .app-shell {
    max-width: 1220px;
    padding: 28px 28px 44px;
    display: grid;
    grid-template-columns: 244px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }

  .top-bar, .bottom-dock, .mobile-only-filter { display: none !important; }

  .desktop-sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 28px;
    padding: 18px 15px;
  }

  .side-section-lbl {
    font-size: 11px; font-weight: 650; color: var(--text-muted);
    letter-spacing: 0.4px; padding: 0 10px; margin-bottom: 4px;
  }

// 时光待办 · 本地状态、时间戳格式化与耗时计算模块
window.TimeTraceStore = (function () {
  const STORAGE_KEY = 'timetrace_todo_store_v1';
  const CFG_KEY = 'timetrace_todo_cfg_v1';

  const PALETTE = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16'];

  function defaultCategories() {
    const t = 1700000000002;
    return [
      { id: 'cat_work', name: '工作', color: '#3b82f6', updatedAt: t, deletedAt: null },
      { id: 'cat_life', name: '生活', color: '#10b981', updatedAt: t, deletedAt: null },
      { id: 'cat_shop', name: '购物', color: '#f59e0b', updatedAt: t, deletedAt: null },
      { id: 'cat_idea', name: '灵感', color: '#ec4899', updatedAt: t, deletedAt: null }
    ];
  }

  function seedSampleTasks() {
    const now = Date.now();
    return [
      {
        id: 't_welcome_1',
        title: '看朋友安利的电影《星际穿越》',
        note: '默认长期有效，不催促；哪天有空去看了再打勾，也可在上方手动设 DDL。',
        categoryId: 'cat_idea',
        dueDate: null,
        createdAt: now - 5 * 86400000 - 3 * 3600000,
        completedAt: null,
        updatedAt: now - 5 * 86400000,
        deletedAt: null
      },
      {
        id: 't_welcome_2',
        title: '拔草收藏很久的街角咖啡馆',
        note: '从随手记下到真正去做，自动记录「时隔多久」达成。',
        categoryId: 'cat_life',
        dueDate: null,
        createdAt: now - 12 * 86400000 - 2 * 3600000,
        completedAt: now - 25 * 60000,
        updatedAt: now - 25 * 60000,
        deletedAt: null
      }
    ];
  }

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.tasks)) {
          if (!Array.isArray(parsed.categories) || !parsed.categories.length) {
            parsed.categories = defaultCategories();
          } else {
            const defMap = { cat_work: '#3b82f6', cat_life: '#10b981', cat_shop: '#f59e0b', cat_idea: '#ec4899' };
            parsed.categories.forEach((c) => {
              if ((c.updatedAt === 1700000000000 || c.updatedAt === 1700000000001) && defMap[c.id]) {
                c.color = defMap[c.id];
                c.updatedAt = 1700000000002;
              }
            });
          }
          return parsed;
        }
      }
    } catch (e) {}
    const init = {
      schemaVersion: 1,
      updatedAt: Date.now(),
      categories: defaultCategories(),
      tasks: seedSampleTasks()
    };
    saveStore(init);
    return init;
  }

  let memStore = null;
  let memCfg = null;

  function saveStore(store) {
    store.updatedAt = Date.now();
    memStore = store;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) {}
  }

  function loadConfig() {
    try {
      const raw = localStorage.getItem(CFG_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    if (memCfg) return memCfg;
    return {
      theme: 'light',
      mode: 'gitee',
      giteeToken: '',
      gistId: '',
      serverUrl: '',
      serverToken: '',
      lastSyncAt: 0
    };
  }

  function saveConfig(cfg) {
    memCfg = cfg;
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function formatShortTime(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    const nowYear = new Date().getFullYear();
    const yPrefix = d.getFullYear() !== nowYear ? d.getFullYear() + '-' : '';
    return yPrefix + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatFullTime(ms) {
    if (!ms) return '—';
    const d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function formatDateKey(ms) {
    const d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function formatClock(ms) {
    const d = new Date(ms);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function toDatetimeLocal(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatDuration(startMs, endMs) {
    if (startMs == null || endMs == null) return '';
    const diff = Math.max(0, endMs - startMs);
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return '<1分钟';
    if (mins < 60) return mins + '分钟';
    const hours = Math.floor(mins / 60);
    const remMins = mins % 60;
    if (hours < 24) return remMins > 0 ? (hours + '小时' + remMins + '分') : (hours + '小时');
    const days = Math.floor(hours / 24);
    if (days >= 3) return days + '天';
    const remHours = hours % 24;
    return remHours > 0 ? (days + '天' + remHours + '小时') : (days + '天');
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  return {
    PALETTE, loadStore, saveStore, loadConfig, saveConfig,
    formatShortTime, formatFullTime, formatDateKey, formatClock,
    toDatetimeLocal, formatDuration, uid
  };
})();

</script>
  <script>
// 时光待办 · 多端无冲突云同步与备份引擎 (Gitee 免服务器云同步 + 私有云接口 + 本地备份)
window.TimeTraceSync = (function () {
  const GIST_FILENAME = 'timetrace_todo_sync_v1.json';
  const GITEE_GISTS_API = ['https:/', 'gitee.com', 'api', 'v5', 'gists'].join('/');

  function mergeById(listA, listB) {
    const map = new Map();
    (listA || []).forEach((it) => { if (it && it.id) map.set(it.id, it); });
    (listB || []).forEach((it) => {
      if (!it || !it.id) return;
      const cur = map.get(it.id);
      if (!cur || (Number(it.updatedAt) || 0) >= (Number(cur.updatedAt) || 0)) {
        map.set(it.id, it);
      }
    });
    return Array.from(map.values());
  }

  function mergeStores(localStore, remoteStore) {
    return {
      schemaVersion: 1,
      updatedAt: Date.now(),
      tasks: mergeById(localStore.tasks, remoteStore.tasks),
      categories: mergeById(localStore.categories, remoteStore.categories)
    };
  }

  function encodePairCode(cfg) {
    const payload = JSON.stringify({
      m: cfg.mode,
      t: cfg.giteeToken || '',
      g: cfg.gistId || '',
      u: cfg.serverUrl || '',
      k: cfg.serverToken || ''
    });
    return 'TT1-' + btoa(unescape(encodeURIComponent(payload)));
  }

  function decodePairCode(code) {
    const clean = (code || '').trim();
    if (!clean.startsWith('TT1-')) throw new Error('配对码格式不正确（需以 TT1- 开头）');
    const obj = JSON.parse(decodeURIComponent(escape(atob(clean.slice(4)))));
    return {
      mode: obj.m || 'gitee',
      giteeToken: obj.t || '',
      gistId: obj.g || '',
      serverUrl: obj.u || '',
      serverToken: obj.k || ''
    };
  }

  async function createGiteeVault(token, initialStore) {
    const cleanToken = (token || '').trim();
    if (!cleanToken) throw new Error('请先填写 Gitee 私人令牌');
    const res = await fetch(GITEE_GISTS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json;charset=UTF-8' },
      body: JSON.stringify({
        access_token: cleanToken,
        description: 'TimeTrace Todo 多端加密同步库 (请勿手动删除)',
        public: false,
        files: { [GIST_FILENAME]: { content: JSON.stringify(initialStore, null, 2) } }
      })
    });
    if (!res.ok) throw new Error('创建云端同步库失败 (' + res.status + ')，请检查令牌是否勾选 gists 权限');
    const data = await res.json();
    return data.id;
  }

  async function syncGitee(cfg, localStore) {
    const token = (cfg.giteeToken || '').trim();
    const gistId = (cfg.gistId || '').trim();
    if (!token || !gistId) throw new Error('请先完善令牌与同步库 ID，或粘贴配对码');

    const getUrl = GITEE_GISTS_API + '/' + encodeURIComponent(gistId) + '?access_token=' + encodeURIComponent(token) + '&_t=' + Date.now();
    const getRes = await fetch(getUrl);
    if (!getRes.ok) throw new Error('读取云端失败 (' + getRes.status + ')');
    const gistObj = await getRes.json();
    let remoteStore = { tasks: [], categories: [] };
    if (gistObj.files && gistObj.files[GIST_FILENAME] && gistObj.files[GIST_FILENAME].content) {
      try { remoteStore = JSON.parse(gistObj.files[GIST_FILENAME].content); } catch (e) {}
    }

    const merged = mergeStores(localStore, remoteStore);
    const patchRes = await fetch(GITEE_GISTS_API + '/' + encodeURIComponent(gistId), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json;charset=UTF-8' },
      body: JSON.stringify({
        access_token: token,
        files: { [GIST_FILENAME]: { content: JSON.stringify(merged) } }
      })
    });
    if (!patchRes.ok) throw new Error('回写云端失败 (' + patchRes.status + ')');
    return merged;
  }

  async function syncCustomServer(cfg, localStore) {
    let base = (cfg.serverUrl || '').trim().replace(/\/+$/, '');
    if (!base) throw new Error('请填写私有服务器地址');
    const endpoint = base.endsWith('/api/sync') ? base : base + '/api/sync';
    const headers = { 'Content-Type': 'application/json' };
    if (cfg.serverToken) headers['X-Sync-Token'] = cfg.serverToken.trim();

    const res = await fetch(endpoint, { method: 'POST', headers, body: JSON.stringify(localStore) });
    if (!res.ok) throw new Error('私有云同步失败 (' + res.status + ')');
    const json = await res.json();
    if (!json.ok || !json.data) throw new Error(json.error || '返回格式异常');
    return mergeStores(localStore, json.data);
  }

  function exportFile(filename, content, mimeType) {
    if (window.AndroidBridge && typeof window.AndroidBridge.saveBackupFile === 'function') {
      const ok = window.AndroidBridge.saveBackupFile(filename, content);
      if (ok) return 'android_downloads';
    }
    const blob = new Blob([content], { type: mimeType || 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
    return 'browser_download';
  }

  return { mergeStores, encodePairCode, decodePairCode, createGiteeVault, syncGitee, syncCustomServer, exportFile };
})();

    if (!ready) return;
    if (autoSyncTimer) clearTimeout(autoSyncTimer);
    autoSyncTimer = setTimeout(() => triggerSync(true), 2200);
  }

  function renderComposerCats() {
    const cats = activeCategories();
    if (!cats.some((c) => c.id === newCatId) && cats.length) newCatId = cats[0].id;
    $('composerCats').innerHTML = cats.map((c) => `
      <button type="button" class="chip ${c.id === newCatId ? 'active' : ''}" data-pick-cat="${esc(c.id)}">
        <span class="cat-dot" style="background:${esc(c.color)}"></span>${esc(c.name)}
      </button>
    `).join('');
  }

  function renderFilterCats() {
    const cats = activeCategories();
    const allCount = activeTasks().filter((t) => !t.completedAt).length;
    let html = `<button type="button" class="chip ${filterCat === 'all' ? 'active' : ''}" data-filter-cat="all">全部 (${allCount})</button>`;
    html += cats.map((c) => {
      const cnt = activeTasks().filter((t) => t.categoryId === c.id && !t.completedAt).length;
      return `<button type="button" class="chip ${filterCat === c.id ? 'active' : ''}" data-filter-cat="${esc(c.id)}">
        <span class="cat-dot" style="background:${esc(c.color)}"></span>${esc(c.name)} (${cnt})
      </button>`;
    }).join('');
    $('filterCats').innerHTML = html;

    const sideEl = $('sidebarCats');
    if (sideEl) {
      let sHtml = `<button type="button" class="side-nav-btn ${activeTab === 'todo' && filterCat === 'all' ? 'active' : ''}" data-filter-cat="all">
        <span class="side-nav-left"><span class="cat-dot" style="background:var(--primary)"></span>全部事项</span>
        <span class="side-cnt">${allCount}</span>
      </button>`;
      sHtml += cats.map((c) => {
        const cnt = activeTasks().filter((t) => t.categoryId === c.id && !t.completedAt).length;
        return `<button type="button" class="side-nav-btn ${activeTab === 'todo' && filterCat === c.id ? 'active' : ''}" data-filter-cat="${esc(c.id)}">
          <span class="side-nav-left"><span class="cat-dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</span>
          <span class="side-cnt">${cnt}</span>
        </button>`;
      }).join('');
      sideEl.innerHTML = sHtml;
    }
  }

  function formatDdlBadge(t, todayKey) {
    if (!t.dueDate) return '';
    const nowYear = String(new Date().getFullYear());
    const shortDue = t.dueDate.startsWith(nowYear + '-') ? t.dueDate.slice(5) : t.dueDate;
    if (t.completedAt) {
      return `<span class="meta-badge badge-cat">DDL ${esc(shortDue)}</span>`;
    }
    const tMs = new Date(todayKey.replace(/-/g, '/') + ' 00:00:00').getTime();
    const dMs = new Date(t.dueDate.replace(/-/g, '/') + ' 00:00:00').getTime();
    const diffDays = Math.round((dMs - tMs) / 86400000);
    if (diffDays < 0) return `<span class="meta-badge badge-ddl-overdue">DDL ${esc(shortDue)} · 超期${Math.abs(diffDays)}天</span>`;
    if (diffDays === 0) return `<span class="meta-badge badge-ddl-soon">DDL 今天截止</span>`;
    if (diffDays <= 3) return `<span class="meta-badge badge-ddl-soon">DDL ${esc(shortDue)} · 剩${diffDays}天</span>`;
    return `<span class="meta-badge badge-ddl">DDL ${esc(shortDue)} · 剩${diffDays}天</span>`;
  }

  function renderNewDdlPill() {
    const pill = $('newDdlPill');
    const txt = $('newDdlText');
    const clr = $('clearNewDdlBtn');
    if (!pill || !txt || !clr) return;
    if (newDueDate) {
      const nowYear = String(new Date().getFullYear());
      const shortDue = newDueDate.startsWith(nowYear + '-') ? newDueDate.slice(5) : newDueDate;
      pill.classList.add('has-ddl');
      txt.textContent = 'DDL ' + shortDue;
      clr.classList.remove('hidden');
    } else {
      pill.classList.remove('has-ddl');
      txt.textContent = '默认长期 · 设DDL';
      clr.classList.add('hidden');
      if ($('newDueInput')) $('newDueInput').value = '';
    }
  }

  function renderTaskList() {
    let list = activeTasks();
    if (filterCat !== 'all') list = list.filter((t) => t.categoryId === filterCat);
    if (filterStatus === 'open') list = list.filter((t) => !t.completedAt);
    if (filterStatus === 'done') list = list.filter((t) => !!t.completedAt);
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      list = list.filter((t) => (t.title || '').toLowerCase().includes(q) || (t.note || '').toLowerCase().includes(q));
    }

    list.sort((a, b) => {
      const aDone = !!a.completedAt;
      const bDone = !!b.completedAt;
      if (aDone !== bDone) return aDone ? 1 : -1;
      if (!aDone) {
        const aHasDue = !!a.dueDate;
        const bHasDue = !!b.dueDate;
        if (aHasDue !== bHasDue) return aHasDue ? -1 : 1;
        if (aHasDue && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
        return (b.createdAt || 0) - (a.createdAt || 0);
      }
      return (b.completedAt || 0) - (a.completedAt || 0);
    });

    const box = $('taskList');
    if (!list.length) {
      box.innerHTML = `<div class="glass-card empty-box">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="opacity:0.48">
          <circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/>
        </svg>
        <p>当前筛选下暂无待办事项，在上方记下一件事吧</p>
      </div>`;
      return;
    }

    const todayKey = S.formatDateKey(Date.now());
    const nowMs = Date.now();
    box.innerHTML = list.map((t) => {
      const done = !!t.completedAt;
      const cat = getCat(t.categoryId);
      const dur = done ? S.formatDuration(t.createdAt, t.completedAt) : '';
      const waitDays = (!done && t.createdAt) ? Math.floor((nowMs - t.createdAt) / 86400000) : 0;
      const ddlBadge = formatDdlBadge(t, todayKey);
      return `<div class="glass-card task-item ${done ? 'done' : ''}" data-task-id="${esc(t.id)}">
        <button type="button" class="check-btn" data-toggle-id="${esc(t.id)}" aria-label="切换完成状态">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
        <div class="task-body">
          <div class="task-top">
            <div class="task-title">${esc(t.title)}</div>
          </div>
          ${t.note ? `<div class="task-note">${esc(t.note)}</div>` : ''}
          <div class="time-meta-row">
            <span class="meta-badge badge-cat"><span class="cat-dot" style="background:${esc(cat.color)}"></span>${esc(cat.name)}</span>
            ${ddlBadge}
            <span class="meta-badge badge-created">创建 ${esc(S.formatShortTime(t.createdAt))}</span>
            ${(!done && !t.dueDate && waitDays >= 1) ? `<span class="meta-badge badge-cat">已记下 ${waitDays}天</span>` : ''}
            ${done ? `<span class="meta-badge badge-completed">完成 ${esc(S.formatShortTime(t.completedAt))}</span>` : ''}
            ${dur ? `<span class="meta-badge badge-duration">时隔 ${esc(dur)}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function renderCalendar(dayMap, todayKey) {
    $('calMonthTitle').textContent = calYear + '年 ' + pad2(calMonth + 1) + '月';
    $('clearDateBtn').classList.toggle('active', !timelineDate);
    $('calHintText').textContent = timelineDate ? ('当前筛选：' + timelineDate + '（再点取消）') : '左右滑动切月 · 点日期筛选';

    const firstDay = new Date(calYear, calMonth, 1);
    const startOffset = (firstDay.getDay() + 6) % 7; // 周一为首列 (0..6)
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

    let cellsHtml = '';
    for (let i = 0; i < totalCells; i++) {
      const cellDate = new Date(calYear, calMonth, 1 - startOffset + i);
      const y = cellDate.getFullYear();
      const m = cellDate.getMonth();
      const d = cellDate.getDate();
      const dKey = y + '-' + pad2(m + 1) + '-' + pad2(d);
      const isOther = m !== calMonth;
      const info = dayMap.get(dKey);
      const hasData = !!(info && (info.ddl || info.create || info.finish));

      let dots = '';
      if (info) {
        if (info.ddl > 0) dots += '<i class="cal-dot ddl" title="有待办DDL截止"></i>';
        if (info.create > 0) dots += '<i class="cal-dot create" title="有新建记录"></i>';
        if (info.finish > 0) dots += '<i class="cal-dot finish" title="有完成记录"></i>';
      }

      const cls = [
        'cal-cell',
        isOther ? 'other-month' : '',
        hasData ? 'has-data' : '',
        dKey === todayKey ? 'is-today' : '',
        dKey === timelineDate ? 'selected' : ''
      ].filter(Boolean).join(' ');

      cellsHtml += `<button type="button" class="${cls}" data-cal-date="${dKey}" data-cal-y="${y}" data-cal-m="${m}">
        <span class="cal-day-num">${d}</span>
        <span class="cal-dots">${dots}</span>
      </button>`;
    }
    $('calGrid').innerHTML = cellsHtml;
  }

  function shiftMonth(delta) {
    const grid = $('calGrid');
    if (grid) {
      grid.style.transform = delta > 0 ? 'translateX(-14px)' : 'translateX(14px)';
      grid.style.opacity = '0.45';
      setTimeout(() => { grid.style.transform = ''; grid.style.opacity = '1'; }, 150);
    }
    const next = new Date(calYear, calMonth + delta, 1);
    calYear = next.getFullYear();
    calMonth = next.getMonth();
    renderTimeline();
  }

  function renderTimeline() {
    const tasks = activeTasks();
    const todayKey = S.formatDateKey(Date.now());
    const monthPrefix = calYear + '-' + pad2(calMonth + 1) + '-';

    const events = [];
    const dayMap = new Map();
    const ensureDay = (k) => {
      if (!dayMap.has(k)) dayMap.set(k, { ddl: 0, create: 0, finish: 0 });
      return dayMap.get(k);
    };

    tasks.forEach((t) => {
      if (t.createdAt) {
        const ck = S.formatDateKey(t.createdAt);
        events.push({ ts: t.createdAt, type: 'create', task: t, dateKey: ck });
        ensureDay(ck).create++;
      }
      if (t.completedAt) {
        const fk = S.formatDateKey(t.completedAt);
        events.push({ ts: t.completedAt, type: 'finish', task: t, dateKey: fk });
        ensureDay(fk).finish++;
      }
      if (t.dueDate) {
        const dueEndTs = new Date(t.dueDate.replace(/-/g, '/') + ' 23:59:00').getTime();
        events.push({ ts: dueEndTs, type: 'ddl', task: t, dateKey: t.dueDate });
        if (!t.completedAt) ensureDay(t.dueDate).ddl++;
      }
    });

    renderCalendar(dayMap, todayKey);

    const filtered = timelineDate
      ? events.filter((e) => e.dateKey === timelineDate)
      : events.filter((e) => e.dateKey.startsWith(monthPrefix));
    filtered.sort((a, b) => b.ts - a.ts);

    const container = $('timelineContainer');
    if (!filtered.length) {
      const emptyMsg = timelineDate
        ? (timelineDate + ' 当天暂无创建或完成记录')
        : (calYear + '年' + (calMonth + 1) + '月暂无记录，可左右滑动切换其他月份');
      container.innerHTML = `<div class="glass-card empty-box"><p>${esc(emptyMsg)}</p></div>`;
      return;
    }

    const groups = new Map();
    filtered.forEach((ev) => {
      if (!groups.has(ev.dateKey)) groups.set(ev.dateKey, []);
      groups.get(ev.dateKey).push(ev);
    });

    const weekNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    let html = '';
    groups.forEach((evList, dKey) => {
      const dObj = new Date(dKey.replace(/-/g, '/') + ' 00:00:00');
      const wk = weekNames[dObj.getDay()] || '';
      const createCnt = evList.filter((e) => e.type === 'create').length;
      const finishCnt = evList.filter((e) => e.type === 'finish').length;
      const ddlCnt = evList.filter((e) => e.type === 'ddl' && !e.task.completedAt).length;
      const tagLabel = dKey === todayKey ? dKey + ' · 今天 (' + wk + ')' : dKey + ' (' + wk + ')';
      const rightSummary = (ddlCnt ? ('DDL ' + ddlCnt + ' · ') : '') + '新建 ' + createCnt + ' · 完成 ' + finishCnt;

      html += `<div class="day-group">
        <div class="day-header">
          <span>${esc(tagLabel)}</span>
          <span>${esc(rightSummary)}</span>
        </div>
        <div class="glass-card timeline-card">
          ${evList.map((ev) => {
            const cat = getCat(ev.task.categoryId);
            const dur = ev.type === 'finish' ? S.formatDuration(ev.task.createdAt, ev.task.completedAt) : '';
            const timeLabel = ev.type === 'ddl' ? '全天' : S.formatClock(ev.ts);
            const typeText = ev.type === 'finish' ? '完成' : (ev.type === 'ddl' ? 'DDL' : '创建');
            return `<div class="tl-row" data-task-id="${esc(ev.task.id)}">
              <div class="tl-time">${esc(timeLabel)}</div>
              <span class="tl-tag ${ev.type}">${typeText}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:550;word-break:break-word">${esc(ev.task.title)}</div>
                <div class="time-meta-row" style="margin-top:4px">
                  <span class="meta-badge badge-cat"><span class="cat-dot" style="background:${esc(cat.color)}"></span>${esc(cat.name)}</span>
                  ${ev.type === 'ddl' ? `<span class="meta-badge ${ev.task.completedAt ? 'badge-completed' : 'badge-ddl-soon'}">${ev.task.completedAt ? '已完成' : '待完成'}</span>` : ''}
                  ${dur ? `<span class="meta-badge badge-duration">时隔 ${esc(dur)}</span>` : ''}
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
    container.innerHTML = html;
  }

  function renderSettings() {
    const tasks = activeTasks();
    const nowObj = new Date();
    const curPrefix = nowObj.getFullYear() + '-' + pad2(nowObj.getMonth() + 1) + '-';
    const doneTasks = tasks.filter((t) => !!t.completedAt);
    const openCnt = tasks.length - doneTasks.length;
    const monthCreate = tasks.filter((t) => t.createdAt && S.formatDateKey(t.createdAt).startsWith(curPrefix)).length;
    const monthDone = doneTasks.filter((t) => S.formatDateKey(t.completedAt).startsWith(curPrefix)).length;

    $('statMonthCreate').textContent = monthCreate;
    $('statMonthDone').textContent = monthDone;
    $('statTotalAll').textContent = tasks.length;
    $('myStatsSub').textContent = `当前待办 ${openCnt} 项 · 累计已完成 ${doneTasks.length} 项`;

    $('syncModeSelect').value = cfg.mode || 'gitee';
    $('giteeBox').classList.toggle('hidden', cfg.mode === 'server');
    $('serverBox').classList.toggle('hidden', cfg.mode !== 'server');
    $('giteeTokenInput').value = cfg.giteeToken || '';
    $('gistIdInput').value = cfg.gistId || '';
    $('serverUrlInput').value = cfg.serverUrl || '';
    $('serverTokenInput').value = cfg.serverToken || '';
    const isBound = (cfg.mode === 'gitee' && cfg.giteeToken && cfg.gistId) || (cfg.mode === 'server' && cfg.serverUrl);
    if (isBound && !$('pairCodeInput').value) {
      try { $('pairCodeInput').value = Sync.encodePairCode(cfg); } catch (e) {}
    }
    $('lastSyncText').textContent = isBound
      ? ('已永久绑定本机 · ' + (cfg.lastSyncAt ? ('上次同步：' + S.formatFullTime(cfg.lastSyncAt)) : '改动后自动静默同步'))
      : '尚未绑定云同步（绑定一次即可永久自动同步）';

    const cats = activeCategories();
    $('manageCatsList').innerHTML = cats.map((c) => `
      <span class="chip" data-recolor-cat="${esc(c.id)}" title="点击切换该标签圆点颜色">
        <span class="cat-dot" style="background:${esc(c.color)}"></span>${esc(c.name)}
        ${cats.length > 1 ? `<button type="button" data-del-cat="${esc(c.id)}" style="border:none;background:none;color:var(--danger);cursor:pointer;padding:0 0 0 4px;font-size:14px">×</button>` : ''}
      </span>
    `).join('');

    const swEl = $('catColorSwatches');
    if (swEl) {
      swEl.innerHTML = S.PALETTE.map((col) => `
        <button type="button" class="swatch-btn ${col === pickedCatColor ? 'active' : ''}" data-pick-swatch="${esc(col)}" style="background:${esc(col)}" aria-label="选择颜色"></button>
      `).join('');
    }
  }

  function updateSyncBadge(state, text) {
    ['syncDot', 'sideSyncDot'].forEach((id) => { if ($(id)) $(id).className = 'sync-dot ' + (state || ''); });
    ['syncLabel', 'sideSyncLabel'].forEach((id) => { if ($(id)) $(id).textContent = text; });
  }

  async function triggerSync(silent) {
    if (isSyncing) return;
    const readyGitee = cfg.mode === 'gitee' && cfg.giteeToken && cfg.gistId;
    const readySrv = cfg.mode === 'server' && cfg.serverUrl;
    if (!readyGitee && !readySrv) {
      if (!silent) {
        switchTab('settings');
        showToast('请先在「我的」页面配置云同步或粘贴配对码');
      }
      return;
    }
    isSyncing = true;
    updateSyncBadge('busy', '同步中');
    try {
      const merged = cfg.mode === 'server'
        ? await Sync.syncCustomServer(cfg, store)
        : await Sync.syncGitee(cfg, store);
      store = merged;
      S.saveStore(store);
      cfg.lastSyncAt = Date.now();
      S.saveConfig(cfg);
      updateSyncBadge('ok', '已同步');
      renderAll();
      if (!silent) showToast('多端数据同步成功');
    } catch (err) {
      updateSyncBadge('err', '同步异常');
      if (!silent) showToast(err.message || '同步失败');
    } finally {
      isSyncing = false;
    }
  }

  function saveSyncInputsQuietly() {
    if (!$('syncModeSelect')) return;
    cfg.mode = $('syncModeSelect').value;
    cfg.giteeToken = $('giteeTokenInput').value.trim();
    cfg.gistId = $('gistIdInput').value.trim();
    cfg.serverUrl = $('serverUrlInput').value.trim();
    cfg.serverToken = $('serverTokenInput').value.trim();
    S.saveConfig(cfg);
  }

  function switchTab(tab) {
    activeTab = tab;
    ['todo', 'timeline', 'settings'].forEach((k) => {
      $('view-' + k).classList.toggle('hidden', k !== tab);
      document.querySelectorAll(`[data-tab="${k}"]`).forEach((btn) => btn.classList.toggle('active', k === tab));
    });
    renderAll();
  }

  function openTaskModal(taskId) {
    const t = activeTasks().find((x) => x.id === taskId);
    if (!t) return;
    editingTaskId = taskId;
    $('editTitle').value = t.title || '';
    $('editNote').value = t.note || '';
    $('editCat').innerHTML = activeCategories().map((c) =>
      `<option value="${esc(c.id)}" ${c.id === t.categoryId ? 'selected' : ''}>${esc(c.name)}</option>`
    ).join('');
    $('editDueDate').value = t.dueDate || '';
    $('editCreatedAt').value = S.toDatetimeLocal(t.createdAt);
    $('editCompletedAt').value = t.completedAt ? S.toDatetimeLocal(t.completedAt) : '';
    $('detailFullTime').textContent = '创建精确记录：' + S.formatFullTime(t.createdAt) +
      ' ｜ 期限：' + (t.dueDate ? ('DDL ' + t.dueDate) : '长期有效') +
      (t.completedAt ? (' ｜ 完成：' + S.formatFullTime(t.completedAt) + '（时隔 ' + S.formatDuration(t.createdAt, t.completedAt) + '）') : '');
    $('taskModal').classList.add('open');
  }

  function closeTaskModal() {
    editingTaskId = null;
    $('taskModal').classList.remove('open');
  }

  function renderAll() {
    const openCnt = activeTasks().filter((t) => !t.completedAt).length;
    const doneCnt = activeTasks().filter((t) => !!t.completedAt).length;
    const subText = `待办 ${openCnt} 项 · 已完成 ${doneCnt} 项`;
    $('brandSubtitle').textContent = subText;
    if ($('sideBrandSub')) $('sideBrandSub').textContent = subText;
    renderComposerCats();
    renderNewDdlPill();
    renderFilterCats();
    renderTaskList();
    if (activeTab === 'timeline') renderTimeline();
    if (activeTab === 'settings') renderSettings();
  }

  window.TimeTraceApp = { triggerSync, switchTab, showToast, openTaskModal, closeTaskModal, renderAll, getState: () => ({ store, cfg }) };

  document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    renderSettings();
    if ((cfg.mode === 'gitee' && cfg.giteeToken && cfg.gistId) || (cfg.mode === 'server' && cfg.serverUrl)) {
      updateSyncBadge('ok', '已绑定');
      triggerSync(true);
    } else {
      updateSyncBadge('', '本地模式');
    }
    renderAll();

    // 新建栏 DDL 选择与恢复长期
    $('newDueInput').addEventListener('change', (e) => {
      newDueDate = e.target.value || '';
      renderNewDdlPill();
    });
    $('newDdlPill').addEventListener('click', () => {
      const inp = $('newDueInput');
      if (inp && typeof inp.showPicker === 'function') {
        try { inp.showPicker(); } catch (err) {}
      }
    });
    $('clearNewDdlBtn').addEventListener('click', () => {
      newDueDate = '';
      renderNewDdlPill();
    });

    // 添加事项
    $('composerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = $('newTaskInput').value.trim();
      if (!title) return;
      const now = Date.now();
      store.tasks.unshift({
        id: S.uid('task'),
        title,
        note: '',
        categoryId: newCatId,
        dueDate: newDueDate || null,
        createdAt: now,
        completedAt: null,
        updatedAt: now,
        deletedAt: null
      });
      $('newTaskInput').value = '';
      newDueDate = '';
      S.saveStore(store);
      renderAll();
      showToast('已记录创建时间 ' + S.formatClock(now));
      scheduleAutoSync();
    });

    // 全局事件委托
    document.body.addEventListener('click', async (e) => {
      const pickBtn = e.target.closest('[data-pick-cat]');
      if (pickBtn) { newCatId = pickBtn.dataset.pickCat; renderComposerCats(); return; }

      const fCatBtn = e.target.closest('[data-filter-cat]');
      if (fCatBtn) {
        filterCat = fCatBtn.dataset.filterCat;
        if (activeTab !== 'todo') switchTab('todo');
        else { renderFilterCats(); renderTaskList(); }
        return;
      }

      const fStatBtn = e.target.closest('[data-status]');
      if (fStatBtn) {
        filterStatus = fStatBtn.dataset.status;
        document.querySelectorAll('[data-status]').forEach((b) => b.classList.toggle('active', b === fStatBtn));
        renderTaskList();
        return;
      }

      const toggleBtn = e.target.closest('[data-toggle-id]');
      if (toggleBtn) {
        e.stopPropagation();
        const id = toggleBtn.dataset.toggleId;
        const t = store.tasks.find((x) => x.id === id);
        if (t) {
          const now = Date.now();
          t.completedAt = t.completedAt ? null : now;
          t.updatedAt = now;
          S.saveStore(store);
          renderAll();
          showToast(t.completedAt ? ('已完成 · 时隔 ' + S.formatDuration(t.createdAt, t.completedAt)) : '已恢复为待办');
          scheduleAutoSync();
        }
        return;
      }

      const card = e.target.closest('[data-task-id]');
      if (card) { openTaskModal(card.dataset.taskId); return; }

      const calBtn = e.target.closest('[data-cal-date]');
      if (calBtn) {
        const dk = calBtn.dataset.calDate;
        calYear = Number(calBtn.dataset.calY);
        calMonth = Number(calBtn.dataset.calM);
        timelineDate = (timelineDate === dk) ? '' : dk;
        renderTimeline();
        return;
      }

      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }

      const delCatBtn = e.target.closest('[data-del-cat]');
      if (delCatBtn) {
        e.stopPropagation();
        const cid = delCatBtn.dataset.delCat;
        const c = store.categories.find((x) => x.id === cid);
        if (c) { c.deletedAt = Date.now(); c.updatedAt = Date.now(); S.saveStore(store); renderAll(); scheduleAutoSync(); }
        return;
      }

      const swBtn = e.target.closest('[data-pick-swatch]');
      if (swBtn) {
        pickedCatColor = swBtn.dataset.pickSwatch;
        renderSettings();
        return;
      }

      const recolorChip = e.target.closest('[data-recolor-cat]');
      if (recolorChip) {
        const c = store.categories.find((x) => x.id === recolorChip.dataset.recolorCat);
        if (c) {
          const idx = S.PALETTE.indexOf(c.color);
          c.color = S.PALETTE[(idx + 1) % S.PALETTE.length];
          c.updatedAt = Date.now();
          S.saveStore(store);
          renderAll();
          showToast('已切换「' + c.name + '」圆点颜色');
          scheduleAutoSync();
        }
      }
    });

    $('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.trim(); renderTaskList(); });
    const toggleTheme = () => { cfg.theme = cfg.theme === 'dark' ? 'light' : 'dark'; S.saveConfig(cfg); applyTheme(); };
    $('themeBtn').addEventListener('click', toggleTheme);
    if ($('sideThemeBtn')) $('sideThemeBtn').addEventListener('click', toggleTheme);
    $('syncBtn').addEventListener('click', () => triggerSync(false));
    if ($('sideSyncBtn')) $('sideSyncBtn').addEventListener('click', () => triggerSync(false));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('taskModal').classList.contains('open')) { closeTaskModal(); return; }
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); switchTab('todo'); $('newTaskInput').focus(); }
      if (e.key === '/') { e.preventDefault(); switchTab('todo'); $('searchInput').focus(); }
    });
    $('calPrevBtn').addEventListener('click', () => shiftMonth(-1));
    $('calNextBtn').addEventListener('click', () => shiftMonth(1));
    $('calTodayBtn').addEventListener('click', () => {
      const n = new Date();
      calYear = n.getFullYear();
      calMonth = n.getMonth();
      timelineDate = S.formatDateKey(Date.now());
      renderTimeline();
    });
    $('clearDateBtn').addEventListener('click', () => { timelineDate = ''; renderTimeline(); });

    // 日历卡片支持手机/平板左右滑动与电脑触控板拖拽切月
    let swipeX = null, swipeY = null;
    const calCard = $('calendarCard');
    calCard.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) { swipeX = e.touches[0].clientX; swipeY = e.touches[0].clientY; }
    }, { passive: true });
    calCard.addEventListener('touchend', (e) => {
      if (swipeX === null || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - swipeX;
      const dy = e.changedTouches[0].clientY - swipeY;
      swipeX = null; swipeY = null;
      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        shiftMonth(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
    let mouseDragX = null;
    calCard.addEventListener('mousedown', (e) => { mouseDragX = e.clientX; });
    calCard.addEventListener('mouseup', (e) => {
      if (mouseDragX === null) return;
      const dx = e.clientX - mouseDragX;
      mouseDragX = null;
      if (Math.abs(dx) > 55) shiftMonth(dx < 0 ? 1 : -1);
    });

    // 弹窗保存与删除
    $('closeModalBtn').addEventListener('click', closeTaskModal);
    $('taskModal').addEventListener('click', (e) => { if (e.target === $('taskModal')) closeTaskModal(); });
    $('clearEditDueBtn').addEventListener('click', () => { $('editDueDate').value = ''; });
    $('saveTaskBtn').addEventListener('click', () => {
      const t = store.tasks.find((x) => x.id === editingTaskId);
      if (!t) return;
      const title = $('editTitle').value.trim();
      if (!title) { showToast('标题不能为空'); return; }
      t.title = title;
      t.note = $('editNote').value.trim();
      t.categoryId = $('editCat').value;
      t.dueDate = $('editDueDate').value || null;
      if ($('editCreatedAt').value) t.createdAt = new Date($('editCreatedAt').value).getTime();
      t.completedAt = $('editCompletedAt').value ? new Date($('editCompletedAt').value).getTime() : null;
      t.updatedAt = Date.now();
      S.saveStore(store);
      closeTaskModal();
      renderAll();
      showToast('修改已保存');
      scheduleAutoSync();
    });
    $('deleteTaskBtn').addEventListener('click', () => {
      const t = store.tasks.find((x) => x.id === editingTaskId);
      if (!t) return;
      t.deletedAt = Date.now();
      t.updatedAt = Date.now();
      S.saveStore(store);
      closeTaskModal();
      renderAll();
      showToast('事项已删除');
      scheduleAutoSync();
    });

    // 设置页：分类、云同步、配对码、备份导入导出
    $('addCatBtn').addEventListener('click', () => {
      const name = $('newCatInput').value.trim();
      if (!name) return;
      const color = pickedCatColor || S.PALETTE[activeCategories().length % S.PALETTE.length];
      store.categories.push({ id: S.uid('cat'), name, color, updatedAt: Date.now(), deletedAt: null });
      pickedCatColor = S.PALETTE[(S.PALETTE.indexOf(color) + 1) % S.PALETTE.length];
      $('newCatInput').value = '';
      S.saveStore(store);
      renderAll();
      showToast('已添加分类「' + name + '」');
      scheduleAutoSync();
    });

    $('syncModeSelect').addEventListener('change', () => { saveSyncInputsQuietly(); renderSettings(); });
    $('createVaultBtn').addEventListener('click', async () => {
      try {
        saveSyncInputsQuietly();
        showToast('正在创建私有同步库...');
        const gistId = await Sync.createGiteeVault(cfg.giteeToken, store);
        cfg.gistId = gistId;
        cfg.lastSyncAt = Date.now();
        S.saveConfig(cfg);
        renderSettings();
        updateSyncBadge('ok', '已同步');
        showToast('创建成功！已自动生成同步库 ID');
      } catch (err) { showToast(err.message); }
    });
    $('saveAndSyncBtn').addEventListener('click', () => {
      saveSyncInputsQuietly();
      triggerSync(false);
    });
    if ($('serverSyncBtn')) {
      $('serverSyncBtn').addEventListener('click', () => {
        saveSyncInputsQuietly();
        triggerSync(false);
      });
    }
    $('copyPairBtn').addEventListener('click', async () => {
      saveSyncInputsQuietly();
      const code = Sync.encodePairCode(cfg);
      $('pairCodeInput').value = code;
      try { await navigator.clipboard.writeText(code); showToast('云同步配对码已复制'); }
      catch (e) { showToast('已生成配对码，请长按复制'); }
    });
    $('applyPairBtn').addEventListener('click', () => {
      try {
        const parsed = Sync.decodePairCode($('pairCodeInput').value);
        Object.assign(cfg, parsed);
        S.saveConfig(cfg);
        renderSettings();
        showToast('配对码已永久保存，正在同步...');
        triggerSync(false);
      } catch (err) { showToast(err.message); }
    });

    $('exportJsonBtn').addEventListener('click', () => {
      const fn = '时光待办备份_' + S.formatDateKey(Date.now()) + '.json';
      const where = Sync.exportFile(fn, JSON.stringify(store, null, 2), 'application/json;charset=utf-8');
      showToast(where === 'android_downloads' ? ('已保存至手机 Download/' + fn) : '备份文件已导出');
    });
    $('exportCsvBtn').addEventListener('click', () => {
      const rows = [['事项名称', '分类', '状态', '截止日期(DDL)', '创建时间', '完成时间', '时隔跨度', '备注']];
      activeTasks().forEach((t) => {
        rows.push([
          t.title, getCat(t.categoryId).name, t.completedAt ? '已完成' : '待完成',
          t.dueDate || '长期有效',
          S.formatFullTime(t.createdAt), t.completedAt ? S.formatFullTime(t.completedAt) : '',
          t.completedAt ? S.formatDuration(t.createdAt, t.completedAt) : '', t.note || ''
        ]);
      });
      const csv = '\uFEFF' + rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
      const fn = '时光待办清单_' + S.formatDateKey(Date.now()) + '.csv';
      const where = Sync.exportFile(fn, csv, 'text/csv;charset=utf-8');
      showToast(where === 'android_downloads' ? ('表格已保存至 Download/' + fn) : 'CSV 表格已导出');
    });
    $('importJsonBtn').addEventListener('click', () => $('importFileInput').click());
    $('importFileInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(String(reader.result || '{}'));
          if (!Array.isArray(imported.tasks)) throw new Error('备份文件格式不正确');
          store = Sync.mergeStores(store, imported);
          S.saveStore(store);
          renderAll();
          showToast('备份已合并导入（共 ' + activeTasks().length + ' 条事项）');
          scheduleAutoSync();
        } catch (err) { showToast(err.message || '导入失败'); }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') triggerSync(true);
    });
  });
})();

</script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    }
  </script>
</body>
</html>
